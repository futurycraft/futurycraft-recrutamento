<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Recrutamento • Feedback | FuturyCraft</title>


<link rel="stylesheet" href="./css/candidatos.css">
<link rel="stylesheet" href="./css/candidatura-feedback.css">


<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>


<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">


</head>


<body>


<div class="background"></div>



<main class="container">



<div class="progress-card">


<div class="progress-top">


<div>


<span class="step">
Etapa 4 de 5
</span>


<h1>
Feedback
</h1>


<p>
Avalie sua experiência no FuturyCraft e ajude a melhorar nosso servidor.
</p>


</div>



<span class="percent">
80%
</span>



</div>



<div class="progress-bar">

<div 
class="progress-fill"
style="width:80%">
</div>

</div>


</div>







<form id="form-feedback" class="form-card">





<div class="feedback-header">


<h2>
⭐ Sua avaliação
</h2>


<p>
Sua opinião ajuda nossa equipe a evoluir cada vez mais.
</p>


</div>









<!-- ==================================================
AVALIAÇÕES
================================================== -->



<div class="avaliacoes">





<div class="avaliacao-card">


<label>
Como você avalia o FuturyCraft?
</label>


<div 
class="estrelas"
data-input="avaliacao_servidor">


<input id="servidor1" type="radio" name="avaliacao_servidor" value="1">
<label for="servidor1">★</label>


<input id="servidor2" type="radio" name="avaliacao_servidor" value="2">
<label for="servidor2">★</label>


<input id="servidor3" type="radio" name="avaliacao_servidor" value="3">
<label for="servidor3">★</label>


<input id="servidor4" type="radio" name="avaliacao_servidor" value="4">
<label for="servidor4">★</label>


<input id="servidor5" type="radio" name="avaliacao_servidor" value="5">
<label for="servidor5">★</label>


</div>


</div>








<div class="avaliacao-card">


<label>
Atendimento da equipe
</label>


<div class="estrelas" data-input="avaliacao_equipe">


<input id="equipe1" type="radio" name="avaliacao_equipe" value="1">
<label for="equipe1">★</label>


<input id="equipe2" type="radio" name="avaliacao_equipe" value="2">
<label for="equipe2">★</label>


<input id="equipe3" type="radio" name="avaliacao_equipe" value="3">
<label for="equipe3">★</label>


<input id="equipe4" type="radio" name="avaliacao_equipe" value="4">
<label for="equipe4">★</label>


<input id="equipe5" type="radio" name="avaliacao_equipe" value="5">
<label for="equipe5">★</label>


</div>


</div>








<div class="avaliacao-card">


<label>
Organização do servidor
</label>


<div class="estrelas" data-input="avaliacao_organizacao">


<input id="org1" type="radio" name="avaliacao_organizacao" value="1">
<label for="org1">★</label>


<input id="org2" type="radio" name="avaliacao_organizacao" value="2">
<label for="org2">★</label>


<input id="org3" type="radio" name="avaliacao_organizacao" value="3">
<label for="org3">★</label>


<input id="org4" type="radio" name="avaliacao_organizacao" value="4">
<label for="org4">★</label>


<input id="org5" type="radio" name="avaliacao_organizacao" value="5">
<label for="org5">★</label>


</div>


</div>








<div class="avaliacao-card">


<label>
Eventos
</label>


<div class="estrelas" data-input="avaliacao_eventos">


<input id="eventos1" type="radio" name="avaliacao_eventos" value="1">
<label for="eventos1">★</label>


<input id="eventos2" type="radio" name="avaliacao_eventos" value="2">
<label for="eventos2">★</label>


<input id="eventos3" type="radio" name="avaliacao_eventos" value="3">
<label for="eventos3">★</label>


<input id="eventos4" type="radio" name="avaliacao_eventos" value="4">
<label for="eventos4">★</label>


<input id="eventos5" type="radio" name="avaliacao_eventos" value="5">
<label for="eventos5">★</label>


</div>


</div>








<div class="avaliacao-card">


<label>
Atualizações
</label>


<div class="estrelas" data-input="avaliacao_atualizacoes">


<input id="update1" type="radio" name="avaliacao_atualizacoes" value="1">
<label for="update1">★</label>


<input id="update2" type="radio" name="avaliacao_atualizacoes" value="2">
<label for="update2">★</label>


<input id="update3" type="radio" name="avaliacao_atualizacoes" value="3">
<label for="update3">★</label>


<input id="update4" type="radio" name="avaliacao_atualizacoes" value="4">
<label for="update4">★</label>


<input id="update5" type="radio" name="avaliacao_atualizacoes" value="5">
<label for="update5">★</label>


</div>


</div>





</div>







<div class="campo">


<label>
O que podemos melhorar?
</label>


<textarea

id="melhorias"

maxlength="800"

placeholder="Deixe sugestões, críticas ou ideias para melhorar o FuturyCraft...">

</textarea>


</div>








<div class="botoes">


<button

type="button"

class="btn-secundario"

onclick="window.location.href='candidatura-perfil.html'">

← Voltar

</button>





<button

type="submit"

class="btn-principal">

Finalizar candidatura →

</button>


</div>






</form>




</main>





<script src="./js/candidatura-feedback.js"></script>


</body>


</html>
