<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Recrutamento • Feedback | FuturyCraft</title>

    <link rel="stylesheet" href="./css/candidatos.css">
    <link rel="stylesheet" href="./css/candidatura-feedback.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

</head>

<body>

<div class="background"></div>

<main class="container">

    <!-- ========================= -->
    <!-- PROGRESSO -->
    <!-- ========================= -->

    <div class="progress-card">

        <div class="progress-top">

            <div>

                <span class="step">
                    Etapa 4 de 5
                </span>

                <h1>
                    Feedback
                </h1>

                <p>
                    Conte para nós como foi sua experiência no FuturyCraft.
                </p>

            </div>

            <span class="percent">
                80%
            </span>

        </div>

        <div class="progress-bar">

            <div
                class="progress-fill"
                style="width:80%">
            </div>

        </div>

    </div>

    <!-- ========================= -->
    <!-- FORMULÁRIO -->
    <!-- ========================= -->

    <form
        id="form-feedback"
        class="form-card">

        <div class="feedback-header">

            <h2>
                ⭐ Avaliação do Servidor
            </h2>

            <p>
                Todas as perguntas são obrigatórias.
            </p>

        </div>

        <!-- ========================= -->
        <!-- AVALIAÇÕES -->
        <!-- ========================= -->

        <div class="avaliacoes">

            <!-- SERVIDOR -->

            <div class="avaliacao-card">

                <label>
                    Como você avalia o FuturyCraft?
                </label>

                <div class="rating" data-name="avaliacao_servidor">

                    <input type="hidden" name="avaliacao_servidor">

                    <button type="button" class="star" data-value="1">★</button>
                    <button type="button" class="star" data-value="2">★</button>
                    <button type="button" class="star" data-value="3">★</button>
                    <button type="button" class="star" data-value="4">★</button>
                    <button type="button" class="star" data-value="5">★</button>

                </div>

            </div>

            <!-- EQUIPE -->

            <div class="avaliacao-card">

                <label>
                    Atendimento da equipe
                </label>

                <div class="rating" data-name="avaliacao_equipe">

                    <input type="hidden" name="avaliacao_equipe">

                    <button type="button" class="star" data-value="1">★</button>
                    <button type="button" class="star" data-value="2">★</button>
                    <button type="button" class="star" data-value="3">★</button>
                    <button type="button" class="star" data-value="4">★</button>
                    <button type="button" class="star" data-value="5">★</button>

                </div>

            </div>

            <!-- ORGANIZAÇÃO -->

            <div class="avaliacao-card">

                <label>
                    Organização do servidor
                </label>

                <div class="rating" data-name="avaliacao_organizacao">

                    <input type="hidden" name="avaliacao_organizacao">

                    <button type="button" class="star" data-value="1">★</button>
                    <button type="button" class="star" data-value="2">★</button>
                    <button type="button" class="star" data-value="3">★</button>
                    <button type="button" class="star" data-value="4">★</button>
                    <button type="button" class="star" data-value="5">★</button>

                </div>

            </div>

            <!-- EVENTOS -->

            <div class="avaliacao-card">

                <label>
                    Eventos do servidor
                </label>

                <div class="rating" data-name="avaliacao_eventos">

                    <input type="hidden" name="avaliacao_eventos">

                    <button type="button" class="star" data-value="1">★</button>
                    <button type="button" class="star" data-value="2">★</button>
                    <button type="button" class="star" data-value="3">★</button>
                    <button type="button" class="star" data-value="4">★</button>
                    <button type="button" class="star" data-value="5">★</button>

                </div>

            </div>

            <!-- ATUALIZAÇÕES -->

            <div class="avaliacao-card">

                <label>
                    Atualizações do servidor
                </label>

                <div class="rating" data-name="avaliacao_atualizacoes">

                    <input type="hidden" name="avaliacao_atualizacoes">

                    <button type="button" class="star" data-value="1">★</button>
                    <button type="button" class="star" data-value="2">★</button>
                    <button type="button" class="star" data-value="3">★</button>
                    <button type="button" class="star" data-value="4">★</button>
                    <button type="button" class="star" data-value="5">★</button>

                </div>

            </div>

        </div>

        <!-- ========================= -->
        <!-- MELHORIAS -->
        <!-- ========================= -->

        <div class="campo">

            <label for="melhorias">
                O que podemos melhorar?
            </label>

            <textarea
                id="melhorias"
                maxlength="800"
                placeholder="Conte para nós quais melhorias você gostaria de ver no FuturyCraft..."></textarea>

            <small id="contador">
                0 / 800
            </small>

        </div>

        <!-- ========================= -->
        <!-- BOTÕES -->
        <!-- ========================= -->

        <div class="botoes">

            <button
                type="button"
                class="btn-secundario"
                onclick="window.location.href='candidatura-perfil.html'">

                ← Voltar

            </button>

            <button
                type="submit"
                class="btn-principal">

                Continuar →

            </button>

        </div>

    </form>

</main>

<script src="./js/candidatura-feedback.js"></script>

</body>
</html>
