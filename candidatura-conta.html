<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Recrutamento • Conta | FuturyCraft</title>

<link rel="stylesheet" href="./css/candidatos.css">  

<link rel="stylesheet" href="./css/candidatura-conta.css">


<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

</head>


<body>


<div class="background"></div>


<main class="container">



<div class="progress-card">


<div class="progress-top">


<div>


<span class="step">
Etapa 2 de 5
</span>


<h1>
Conta e Servidor
</h1>


<p>
Conte um pouco sobre sua conta, disponibilidade e experiência no FuturyCraft.
</p>


</div>


<span class="percent">
40%
</span>


</div>



<div class="progress-bar">

<div 
class="progress-fill"
style="width:40%">
</div>

</div>


</div>





<form id="form-conta" class="form-card">





<!-- ==========================================
TIPO DE CONTA
========================================== -->


<div class="campo">


<label>
Seu Minecraft é:
</label>



<div class="opcoes">



<div class="opcao">


<input
type="radio"
id="original"
name="tipo_conta"
value="Original"
>


<label for="original">
Original
</label>


</div>




<div class="opcao">


<input
type="radio"
id="pirata"
name="tipo_conta"
value="Pirata"
>


<label for="pirata">
Pirata
</label>


</div>



</div>


</div>






<!-- ==========================================
PLATAFORMA
========================================== -->


<div class="campo">


<label>
Em qual plataforma você joga?
</label>



<div class="opcoes">



<div class="opcao">


<input
type="radio"
id="java"
name="plataforma"
value="Java"
>


<label for="java">
Java
</label>


</div>





<div class="opcao">


<input
type="radio"
id="bedrock"
name="plataforma"
value="Bedrock"
>


<label for="bedrock">
Bedrock
</label>


</div>





<div class="opcao">


<input
type="radio"
id="ambas"
name="plataforma"
value="Ambas"
>


<label for="ambas">
Ambas
</label>


</div>



</div>


</div>






<!-- ==========================================
ACESSO CONTA
========================================== -->


<div class="campo">


<label>
Alguém além de você possui acesso à sua conta?
</label>



<div class="opcoes">



<div class="opcao">


<input
type="radio"
id="acesso-nao"
name="acesso_conta"
value="Não"
>


<label for="acesso-nao">
Não
</label>


</div>




<div class="opcao">


<input
type="radio"
id="acesso-sim"
name="acesso_conta"
value="Sim"
>


<label for="acesso-sim">
Sim
</label>


</div>



</div>


</div>

<!-- ==========================================
TEMPO NO SERVIDOR
========================================== -->


<div class="campo">


<label>
Há quanto tempo você joga no FuturyCraft?
</label>



<div class="slider-container">


<input

type="range"

id="tempo_servidor"

name="tempo_servidor"

min="0"

max="60"

value="12"

>


<div class="slider-info">


<span id="tempo-valor">
12
</span>


<span>
meses
</span>


</div>



</div>


</div>

========================================== -->


<div class="campo">


<label>
Em qual modo você gostaria de ser ajudante?
</label>



<div class="opcoes">



<div class="opcao">


<input

type="radio"

id="skyblock"

name="modo_interesse"

value="Skyblock"

>


<label for="skyblock">

Skyblock

</label>


</div>





<div class="opcao">


<input

type="radio"

id="rankup"

value="Rankup"

>


<label for="rankup">

Rankup

</label>


</div>





<div class="opcao">


<input

type="radio"

id="survival"

>


<label for="survival">

Survival

</label>

</div>

<!-- ==========================================
BOTÕES NAVEGAÇÃO
========================================== -->


<div class="botoes">

</span>

</main>
