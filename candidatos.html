<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Recrutamento • Dados Pessoais | FuturyCraft</title>

    <link rel="stylesheet" href="./css/candidatura.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

</head>

<body>

<div class="background"></div>

<main class="container">

    <div class="progress-card">

        <div class="progress-top">

            <div>

                <span class="step">
                    Etapa 1 de 5
                </span>

                <h1>Dados Pessoais</h1>

                <p>
                    Preencha suas informações básicas para iniciarmos sua candidatura.
                </p>

            </div>

            <span class="percent">
                20%
            </span>

        </div>

        <div class="progress-bar">

            <div class="progress-fill"></div>

        </div>

    </div>


    <form id="form-dados" class="form-card">

        <!-- Nome -->

        <div class="campo">

            <label for="nome">
                Nome Completo *
            </label>

            <input
                type="text"
                id="nome"
                name="nome"
                maxlength="100"
                required
                placeholder="Digite seu nome completo">

        </div>


        <!-- Nick -->

        <div class="campo">

            <label for="nick">
                Nick no Minecraft *
            </label>

            <input
                type="text"
                id="nick"
                name="nick"
                maxlength="16"
                required
                placeholder="Ex: FuturyPlayer">

        </div>


        <!-- Discord -->

        <div class="campo">

            <label for="discord">
                Usuário do Discord *
            </label>

            <input
                type="text"
                id="discord"
                name="discord"
                required
                placeholder="@usuario">

        </div>


        <div class="grid">

            <!-- Idade -->

            <div class="campo">

                <label for="idade">
                    Idade *
                </label>

                <input
                    type="number"
                    id="idade"
                    name="idade"
                    min="13"
                    max="99"
                    required>

            </div>


            <!-- Data -->

            <div class="campo">

                <label for="data">
                    Data de nascimento *
                </label>

                <input
                    type="date"
                    id="data"
                    name="data"
                    required>

            </div>

        </div>


        <!-- Gênero -->

        <div class="campo">

            <label for="genero">
                Gênero
            </label>

            <select
                id="genero"
                name="genero">

                <option value="">
                    Prefiro não informar
                </option>

                <option value="Masculino">
                    Masculino
                </option>

                <option value="Feminino">
                    Feminino
                </option>

                <option value="Outro">
                    Outro
                </option>

            </select>

        </div>


        <div class="botoes">

            <button
                type="button"
                class="btn-secundario"
                onclick="history.back()">

                Voltar

            </button>

            <button
                type="submit"
                class="btn-principal">

                Próxima etapa →

            </button>

        </div>

    </form>

</main>

<script src="./js/candidatura.js"></script>

</body>
</html>
