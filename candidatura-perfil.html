<div class="background"></div>


<main class="container">



<div class="progress-card">


<div class="progress-top">


<div>


<span class="step" id="step-etapa"></span>


<h1>
Perfil e Experiência
</h1>


<p>
Agora queremos conhecer sua personalidade, experiência e como você lidaria como parte da equipe.
</p>


</div>


<span class="percent">
60%
</span>


</div>



<div class="progress-bar">

<div 
class="progress-fill"
style="width:60%">
</div>

</div>


</div>





<form id="form-perfil" class="form-card">




<div id="bloco-sobre"></div>



<div id="bloco-situacoes"></div>
<!-- ==================================================
EXPERIÊNCIA STAFF
================================================== -->


<div class="secao-card">


<div class="secao-header">


<span>
⭐
</span>


<h2>
Experiência anterior
</h2>


</div>





<div class="campo">


<label>
Você já fez parte da equipe de algum servidor?
</label>


<div class="opcoes">


<div class="opcao">


<input

type="radio"

id="staff-sim"

name="experiencia_staff"

value="Sim"

>


<label for="staff-sim">

Sim, já fui staff

</label>


</div>





<div class="opcao">


<input

type="radio"

id="staff-nao"

name="experiencia_staff"

value="Não"

>


<label for="staff-nao">

Não, primeira experiência

</label>


</div>



</div>


</div>





<div 

id="experiencia-box"

class="experiencia-box escondido">





<div class="campo">


<label>
Nome do servidor
</label>


<input

id="servidor_anterior"

type="text"

placeholder="Digite o nome do servidor">

</div>





<div class="campo">


<label>
Cargo ocupado
</label>


<input

id="cargo_anterior"

type="text"

placeholder="Ex: Moderador, Ajudante, Admin">

</div>





<div class="campo">


<label>
Quanto tempo permaneceu na equipe?
</label>


<input

id="tempo_staff"

type="text"

placeholder="Ex: 6 meses">

</div>





<div class="campo">


<label>
Por que saiu da equipe?
</label>


<textarea

id="motivo_saida"

placeholder="Explique o motivo da saída...">

</textarea>


</div>




</div>


</div>

<button

type="button"

class="btn-secundario"

onclick="window.location.href='candidatura-conta.html'"

>

</button>





<button

type="submit"

class="btn-principal"

>


Próxima etapa →


</button>
